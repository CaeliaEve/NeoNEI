name: CI
on:
  push:
    branches: [main, refactor/core]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Behavior checks
        run: npm test
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium --only-shell
      - name: Bundle
        run: npm run release
      - name: Verify production bundle
        run: |
          npm ci --omit=dev --workspace catalog --workspace backend --prefix release/neonei-web
          node scripts/check-release.mjs release/neonei-web
      - name: Browser behavior in production bundle
        env:
          NEONEI_TEST_BUNDLE: ${{ github.workspace }}/release/neonei-web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: neonei-web
          path: release/neonei-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: frontend/test-results
