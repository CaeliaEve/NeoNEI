name: CI

on:
  push:
    branches:
      - main
      - elysium
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Backend path audit
        working-directory: backend
        run: npm run audit:paths

      - name: Backend public runtime profile regression
        working-directory: backend
        run: npm run test:public-runtime-profile

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neonei-backend-dist
          path: backend/dist
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check canonical retired
        run: node scripts/check-canonical-retired.mjs

      - name: Raw export compiler self-test
        working-directory: frontend
        run: npm run test:raw-export

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend path audit
        working-directory: frontend
        run: npm run audit:paths

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neonei-frontend-dist
          path: frontend/dist
          if-no-files-found: warn
